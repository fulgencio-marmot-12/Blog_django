{% extends "base.html" %}

{% block titulo %}Borrar entrada{% endblock %}

{% block contenido %}
<section class="formulario">
    <h1>Borrar entrada</h1>

    <p>¿Seguro que querés borrar <strong>{{ object.title }}</strong>? No se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <div class="botones">
            <button class="boton" type="submit">Sí, borrar</button>
            <a class="boton-secundario" href="{{ object.get_absolute_url }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
